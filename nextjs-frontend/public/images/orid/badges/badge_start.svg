<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Badge circle background -->
  <circle cx="40" cy="40" r="36" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <!-- Pinecone body -->
  <ellipse cx="40" cy="44" rx="13" ry="16" fill="#92400E"/>
  <!-- Pinecone scales -->
  <ellipse cx="40" cy="35" rx="7" ry="4.5" fill="#B45309"/>
  <ellipse cx="34" cy="40" rx="6" ry="4" fill="#B45309"/>
  <ellipse cx="46" cy="40" rx="6" ry="4" fill="#B45309"/>
  <ellipse cx="37" cy="46" rx="6" ry="4" fill="#B45309"/>
  <ellipse cx="43" cy="46" rx="6" ry="4" fill="#B45309"/>
  <ellipse cx="40" cy="52" rx="7" ry="4.5" fill="#B45309"/>
  <!-- Pencil -->
  <rect x="52" y="20" width="6" height="22" rx="1.5" fill="#FBBF24" transform="rotate(-30 52 20)"/>
  <polygon points="52,20 58,20 55,14" fill="#F87171" transform="rotate(-30 55 17)"/>
  <!-- Cap -->
  <rect x="52" y="38" width="6" height="3" rx="1" fill="#9CA3AF" transform="rotate(-30 52 38)"/>
  <!-- Shine -->
  <circle cx="32" cy="32" r="4" fill="white" opacity="0.3"/>
</svg>
