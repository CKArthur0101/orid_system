# Development-only compose file.
# Production target is: Docker/VPS containers for app + managed Postgres (for example Supabase).
services:
  backend:
    build:
      context: fastapi_backend
    env_file:
      - .env
    environment:
      - OPENAPI_OUTPUT_FILE=./shared-data/openapi.json
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/mydatabase
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:password@db_test:5432/testdatabase
      - DB_DISABLE_POOLING=false
      - MAIL_SERVER=mailhog
      - ENABLE_PUBLIC_REGISTRATION_AND_PASSWORD_RESET=false
      - ORID_FORCE_NEW_ALLOWLIST=${ORID_FORCE_NEW_ALLOWLIST:-114524020}
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - my_network
    volumes:
      - ./fastapi_backend:/app
      - fastapi-venv:/app/.venv
      - ./local-shared-data:/app/shared-data
    depends_on:
      - db
      - db_test

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "15432:5432" # ✅ 主資料庫 host:15432 -> container:5432
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdatabase
    ports:
      - "5433:5432" # ✅ 測試資料庫 host:5433 -> container:5432
    networks:
      - my_network
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: always

  frontend:
    build:
      context: ./nextjs-frontend
    user: node
    ports:
      - "127.0.0.1:3100:3000" # ✅ 用 3100 避開 3000 被佔用/被擋
    # Next 16 會寫入 .next/dev/logs；bind mount 常無此路徑，需先建立否則 ENOENT
    command: sh -c "mkdir -p /app/.next/dev/logs && npm run dev -- --hostname 0.0.0.0 --port 3000"
    networks:
      - my_network
    environment:
      NODE_ENV: development
      API_BASE_URL: http://backend:8000 # ✅ 容器內用 backend:8000
      ACCESS_TOKEN_COOKIE_MAX_AGE_SEC: 43200
      OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
      NEXT_PUBLIC_ENABLE_PUBLIC_REGISTRATION_AND_PASSWORD_RESET: "false"
    volumes:
      - ./nextjs-frontend:/app
      - nextjs-node-modules:/app/node_modules
      - ./local-shared-data:/app/shared-data
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - my_network

volumes:
  postgres_data:
  postgres_test_data:
  nextjs-node-modules:
  fastapi-venv:

networks:
  my_network:
    driver: bridge
