services:
  backend:
    build:
      context: fastapi_backend
    env_file:
      - .env
    environment:
      - OPENAPI_OUTPUT_FILE=./shared-data/openapi.json
      # 這裡是「容器內部」連線，不用跟著 host port 改
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/mydatabase
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:password@db_test:5432/testdatabase
      - MAIL_SERVER=mailhog
    ports:
      - "8001:8000"
    networks:
      - my_network
    volumes:
      - ./fastapi_backend:/app
      - fastapi-venv:/app/.venv
      - ./local-shared-data:/app/shared-data
    depends_on:
      - db
      - db_test

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    # ✅ 主資料庫改成 15432 -> 5432
    ports:
      - "15432:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdatabase
    # ✅ 測試資料庫維持 5433 -> 5432（你原本就這樣跑）
    ports:
      - "5433:5432"
    networks:
      - my_network
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: always

  frontend:
    build:
      context: ./nextjs-frontend
    user: node
    ports:
      - "3000:3000"
    networks:
      - my_network
    environment:
      NODE_ENV: development
      API_BASE_URL: http://backend:8000
      OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
    volumes:
      - ./nextjs-frontend:/app
      - nextjs-node-modules:/app/node_modules
      - ./local-shared-data:/app/shared-data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - my_network

volumes:
  postgres_data:
  postgres_test_data:
  nextjs-node-modules:
  fastapi-venv:

networks:
  my_network:
    driver: bridge
